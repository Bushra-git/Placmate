<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Placemate - Book Equipment</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* Basic styling if styles.css is not available */
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }
    header {
      background-color: #2c3e50;
      color: white;
      padding: 1rem;
    }
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 600;
    }
    ul {
      display: flex;
      list-style: none;
    }
    li {
      margin-left: 1.5rem;
    }
    a {
      color: white;
      text-decoration: none;
    }
    .btn {
      background-color: #e74c3c;
      padding: 0.5rem 1rem;
      border-radius: 4px;
    }
    .booking-form {
      max-width: 600px;
      margin: 2rem auto;
      padding: 1rem;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
    }
    input {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    button {
      background-color: #2c3e50;
      color: white;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }
    footer {
      background-color: #f8f9fa;
      text-align: center;
      padding: 1rem;
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <div class="logo">Placemate</div>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="venues.html">Classrooms</a></li>
        <li><a href="equipment.html">Equipment</a></li>
        <li><a href="login.html">Login</a></li>
        <li><a href="signup.html" class="btn">Sign Up</a></li>
      </ul>
    </nav>
  </header>

  <section class="booking-form">
    <h2>Book Equipment</h2>
    <form id="equipmentBookingForm">
      <div class="form-group">
        <label for="equipment">Equipment</label>
        <input type="text" id="equipment" name="equipment" readonly>
      </div>
      <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-group">
        <label for="date">Booking Date</label>
        <input type="date" id="date" name="date" required>
      </div>
      <div class="form-group">
        <label for="start-time">Start Time</label>
        <input type="time" id="start-time" name="start-time" required>
      </div>
      <div class="form-group">
        <label for="end-time">End Time</label>
        <input type="time" id="end-time" name="end-time" required>
      </div>
      <div class="form-group">
        <label for="quantity">Quantity (Max available: <span id="max-quantity">1</span>)</label>
        <input type="number" id="quantity" name="quantity" min="1" value="1" required>
      </div>
      <button type="submit" class="btn">Confirm Booking</button>
    </form>
    <div id="confirmation-message" style="display: none; margin-top: 1rem; padding: 1rem; background-color: #d4edda; color: #155724; border-radius: 4px;"></div>
  </section>

  <footer>
    <p>&copy; 2025 Placemate. All rights reserved.</p>
    <p>Vidyalankar Institute of Technology, Mumbai</p>
  </footer>

  <script>
    // Get the equipment ID from the URL
    const urlParams = new URLSearchParams(window.location.search);
    const equipmentId = urlParams.get("equipment");

    // Sample equipment data
    const equipment = [
      { id: "proj1", name: "Projector 1", type: "visual", quantity: 5, description: "HD Projector with HDMI input" },
      { id: "proj2", name: "Projector 2", type: "visual", quantity: 3, description: "4K Projector with multiple inputs" },
      { id: "mic1", name: "Wireless Mic Set", type: "audio", quantity: 8, description: "Set of 2 wireless microphones with receiver" },
      { id: "mic2", name: "Wired Mic", type: "audio", quantity: 15, description: "Standard wired microphone" },
      { id: "speaker1", name: "PA Speaker", type: "audio", quantity: 6, description: "Portable PA speaker with stand" },
      { id: "speaker2", name: "Subwoofer", type: "audio", quantity: 2, description: "Powerful subwoofer for events" },
      { id: "screen1", name: "Projection Screen", type: "visual", quantity: 4, description: "120\" motorized projection screen" },
      { id: "laptop1", name: "Presentation Laptop", type: "other", quantity: 5, description: "Laptop with presentation software" },
      { id: "cam1", name: "Video Camera", type: "visual", quantity: 3, description: "4K video camera with tripod" },
      { id: "light1", name: "Stage Lights", type: "other", quantity: 2, description: "Set of 4 LED stage lights" },
    ];

    // Set the equipment name in the form and update max quantity
    if (equipmentId) {
      const equipmentItem = equipment.find(item => item.id === equipmentId);
      if (equipmentItem) {
        document.getElementById("equipment").value = equipmentItem.name;
        document.getElementById("max-quantity").textContent = equipmentItem.quantity;
        document.getElementById("quantity").max = equipmentItem.quantity;
      }
    }

    // Handle form submission
    document.getElementById("equipmentBookingForm").addEventListener("submit", (e) => {
      e.preventDefault();

      // Get form values
      const equipmentName = document.getElementById("equipment").value;
      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const date = document.getElementById("date").value;
      const startTime = document.getElementById("start-time").value;
      const endTime = document.getElementById("end-time").value;
      const quantity = document.getElementById("quantity").value;

      // Validate time
      if (startTime >= endTime) {
        alert("End time must be after start time");
        return;
      }

      // Validate date (not in the past)
      const today = new Date().toISOString().split('T')[0];
      if (date < today) {
        alert("Booking date cannot be in the past");
        return;
      }

      // In a real app, you would send this data to a server
      // For now, we'll just show a confirmation message
      const confirmationMessage = document.getElementById("confirmation-message");
      confirmationMessage.innerHTML = `
        <p><strong>Booking Confirmed!</strong></p>
        <p>Equipment: ${equipmentName}</p>
        <p>Name: ${name}</p>
        <p>Date: ${date}</p>
        <p>Time: ${startTime} - ${endTime}</p>
        <p>Quantity: ${quantity}</p>
        <p>A confirmation has been sent to ${email}</p>
      `;
      confirmationMessage.style.display = "block";
      
      // Reset form
      document.getElementById("equipmentBookingForm").reset();
      
      // Scroll to confirmation message
      confirmationMessage.scrollIntoView({ behavior: 'smooth' });
    });

    // Set minimum date to today
    document.getElementById("date").min = new Date().toISOString().split('T')[0];
  </script>
</body>
</html>
